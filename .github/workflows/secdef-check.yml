name: SECURITY DEFINER guard

# Re-runs the two targeted SECURITY DEFINER execute-grant checks whenever a
# migration (or the checker's own runtime/dependency state) changes, and fails
# the build if the anon/PUBLIC finding reappears or a new function becomes
# callable by signed-in users.
#
# The job proves BOTH paths on every run:
#   negative path - a probe SECURITY DEFINER function granted to anon must make
#                   the checker exit 1;
#   positive path - after dropping the probe, the checker must exit 0.

on:
  push:
    paths:
      - "supabase/migrations/**"
      - "scripts/secdef-check.ts"
      - ".github/workflows/secdef-check.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "scripts/secdef-check.ts"
      - ".github/workflows/secdef-check.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

jobs:
  secdef-check:
    name: SECURITY DEFINER execute grants
    runs-on: ubuntu-latest
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the project-approved Bun runtime for deterministic runs.
          bun-version: 1.3.3

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start ephemeral Postgres
        run: |
          docker run -d --name secdef-pg \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 postgres:15
          for i in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres

      - name: Bootstrap Supabase roles
        run: |
          psql -v ON_ERROR_STOP=1 -c "
            DO \$\$ BEGIN
              CREATE ROLE anon NOLOGIN;
              CREATE ROLE authenticated NOLOGIN;
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
              CREATE ROLE supabase_auth_admin NOLOGIN;
            EXCEPTION WHEN duplicate_object THEN NULL; END \$\$;
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY, email text, raw_user_meta_data jsonb);
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS \$\$ SELECT NULL::uuid \$\$;
            CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS \$\$ SELECT NULL::text \$\$;
            CREATE EXTENSION IF NOT EXISTS pgcrypto;
          "

      - name: Apply migrations
        run: |
          set -e
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Negative path - probe granted to anon must fail the check
        run: |
          set -e
          # Isolated: strip the PUBLIC default first so the only reachable
          # grant under test is the explicit anon grant.
          psql -v ON_ERROR_STOP=1 -c "
            CREATE FUNCTION public.__secdef_probe() RETURNS boolean
            LANGUAGE sql SECURITY DEFINER SET search_path = public AS \$\$ SELECT true \$\$;
            REVOKE ALL ON FUNCTION public.__secdef_probe() FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION public.__secdef_probe() TO anon;
          "
          set +e
          bun run security:secdef -- --json=security-results/secdef-negative-anon.json
          code=$?
          set -e
          psql -v ON_ERROR_STOP=1 -c "DROP FUNCTION public.__secdef_probe();"
          if [ "$code" -ne 1 ]; then
            echo "::error::anon negative path did not fail as expected (exit $code, want 1)"
            exit 1
          fi
          bun run scripts/secdef-assert.ts security-results/secdef-negative-anon.json FAIL \
            "fn=public.__secdef_probe()" role=anon \
            checks=anon_or_public_execute,anon_effective_execute
          echo "anon negative path OK: exit 1 and the expected violation is present in the evidence"

      - name: Negative path - overload of an allowlisted name must fail the check
        run: |
          set -e
          # Isolated: revoke the PUBLIC default (and anon) so the ONLY grant is
          # to authenticated. A failure here can therefore only come from
          # signature-level allowlisting, not from PUBLIC/anon reachability.
          psql -v ON_ERROR_STOP=1 -c "
            CREATE FUNCTION public.has_role(text) RETURNS boolean
            LANGUAGE sql SECURITY DEFINER SET search_path = public AS \$\$ SELECT true \$\$;
            REVOKE ALL ON FUNCTION public.has_role(text) FROM PUBLIC;
            REVOKE ALL ON FUNCTION public.has_role(text) FROM anon;
            GRANT EXECUTE ON FUNCTION public.has_role(text) TO authenticated;
          "
          psql -v ON_ERROR_STOP=1 -Atc "
            SELECT 'anon_execute=' || has_function_privilege('anon', 'public.has_role(text)', 'EXECUTE')::text
                || ' authenticated_execute=' || has_function_privilege('authenticated', 'public.has_role(text)', 'EXECUTE')::text
          "
          set +e
          bun run security:secdef -- --json=security-results/secdef-negative-overload.json
          code=$?
          set -e
          psql -v ON_ERROR_STOP=1 -c "DROP FUNCTION public.has_role(text);"
          if [ "$code" -ne 1 ]; then
            echo "::error::overload negative path did not fail as expected (exit $code, want 1)"
            exit 1
          fi
          bun run scripts/secdef-assert.ts security-results/secdef-negative-overload.json FAIL \
            "fn=public.has_role(text)" role=authenticated \
            checks=authenticated_execute_allowlist,authenticated_effective_allowlist
          echo "overload negative path OK: signature-level allowlist enforced in isolation"

      - name: Positive path - clean schema must pass
        run: |
          set -e
          bun run security:secdef -- --json=security-results/secdef-check.json
          bun run scripts/secdef-assert.ts security-results/secdef-check.json PASS

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secdef-check-evidence
          path: security-results/
          retention-days: 90
          if-no-files-found: error

